zy" alt="Fichas de articulación, fonema por fonema"></a><figcaption><small>2 · mockup · inicial · 2026-09-21 19:00 Madrid</small><h2>Fichas de articulación, fonema por fonema</h2><p>Un vistazo por dentro al pack de 30 fichas de articulación. Incluye pictogramas, palabras por posición y silabario: material de logopedia en PDF con instrucciones para el adulto y registro de progreso.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/recursos/fichas-articulacion?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-articulacion">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-cuaderno-0-3-1.png?v=2"><img src="pin-cuaderno-0-3-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Cuaderno de lenguaje de 0–3 años"></a><figcaption><small>3 · mockup · inicial · 2026-09-21 10:00 Madrid</small><h2>Cuaderno de lenguaje de 0–3 años</h2><p>Para acompañar las primeras etapas del lenguaje: 20 actividades organizadas por edad, con materiales cotidianos e instrucciones paso a paso. Mira el interior del cuaderno de estimulación de 0 a 3 años.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/recursos/cuaderno-0-3?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-cuaderno-0-3">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-cuaderno-3-6-1.png?v=2"><img src="pin-cuaderno-3-6-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Cuaderno de lenguaje de 3–6 años"></a><figcaption><small>4 · mockup · inicial · 2026-09-21 19:00 Madrid</small><h2>Cuaderno de lenguaje de 3–6 años</h2><p>Rimas, vocabulario, historias y comprensión en un mismo cuaderno. Son 20 actividades de lenguaje de 3 a 6 años, repartidas en cinco bloques y con variaciones por dificultad para acompañar la práctica.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/recursos/cuaderno-3-6?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-cuaderno-3-6">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-kit-soplo-1.png?v=2"><img src="pin-kit-soplo-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Soplo: juegos con materiales caseros"></a><figcaption><small>5 · mockup · inicial · 2026-09-21 10:00 Madrid</small><h2>Soplo: juegos con materiales caseros</h2><p>Pompas, plumas y otros materiales de casa forman parte de este kit de soplo. Reúne 15 ejercicios progresivos y una tabla de seguimiento, con enfoque de control respiratorio y consciencia oral.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/recursos/kit-soplo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-kit-soplo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-pack-completo-1.png?v=2"><img src="pin-pack-completo-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Logopedia infantil: mira el pack por dentro"></a><figcaption><small>6 · mockup · inicial · 2026-09-21 19:00 Madrid</small><h2>Logopedia infantil: mira el pack por dentro</h2><p>Fichas de articulación, cuadernos de lenguaje de 0–3 y 3–6 años, kit de soplo y calendario semanal. Mira el material del Pack Completo de logopedia infantil y comprueba qué incluye cada recurso.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/recursos/pack-completo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-pack-completo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-fichas-logopedia-gratis-imprimir-2.png?v=2"><img src="pin-fichas-logopedia-gratis-imprimir-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Fichas gratuitas: empieza por la muestra"></a><figcaption><small>7 · mockup · inicial · 2026-09-21 10:00 Madrid</small><h2>Fichas gratuitas: empieza por la muestra</h2><p>Antes de elegir material de logopedia, mira una muestra real. La descarga gratuita reúne seis fichas del fonema R con pictogramas; el artículo también presenta recursos de vocabulario y comprensión.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/blog/fichas-logopedia-gratis-imprimir?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-logopedia-gratis-imprimir">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-fichas-articulacion-2.png?v=2"><img src="pin-fichas-articulacion-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Articulación: pictogramas, palabras y sílabas"></a><figcaption><small>8 · mockup · inicial · 2026-09-21 19:00 Madrid</small><h2>Articulación: pictogramas, palabras y sílabas</h2><p>Así son las fichas de articulación del pack: pictogramas, palabras organizadas por posición y un silabario de práctica. Un PDF de logopedia con guía para adultos y espacio para registrar el progreso.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/recursos/fichas-articulacion?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-articulacion">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-cuaderno-0-3-2.png?v=2"><img src="pin-cuaderno-0-3-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Primeras palabras, materiales de cada día"></a><figcaption><small>9 · mockup · inicial · 2026-09-22 10:00 Madrid</small><h2>Primeras palabras, materiales de cada día</h2><p>No necesitas un armario lleno de materiales para usar este cuaderno de estimulación. Sus actividades de lenguaje de 0 a 3 años indican qué preparar, cómo acompañar el juego y cuánto dura cada propuesta.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/recursos/cuaderno-0-3?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-cuaderno-0-3">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-cuaderno-3-6-2.png?v=2"><img src="pin-cuaderno-3-6-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Rimas y vocabulario de 3–6 años"></a><figcaption><small>10 · mockup · inicial · 2026-09-22 19:00 Madrid</small><h2>Rimas y vocabulario de 3–6 años</h2><p>El cuaderno de lenguaje de 3 a 6 años dedica un bloque a la conciencia fonológica y otro al vocabulario. Aquí puedes ver sus páginas de actividad, con materiales, pasos y variaciones de dificultad.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/recursos/cuaderno-3-6?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-cuaderno-3-6">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-pack-completo-2.png?v=2"><img src="pin-pack-completo-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Un calendario para organizar los materiales"></a><figcaption><small>11 · mockup · inicial · 2026-09-22 10:00 Madrid</small><h2>Un calendario para organizar los materiales</h2><p>El Pack Completo de logopedia incluye un calendario semanal junto a las fichas, los cuadernos y el kit de soplo. Un espacio para anotar actividades, tiempos y observaciones sobre el trabajo de la semana.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/recursos/pack-completo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-pack-completo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-fichas-logopedia-gratis-imprimir-3.png?v=2"><img src="pin-fichas-logopedia-gratis-imprimir-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Seis fichas gratuitas del fonema R"></a><figcaption><small>12 · mockup · inicial · 2026-09-22 19:00 Madrid</small><h2>Seis fichas gratuitas del fonema R</h2><p>¿Quieres ver las fichas antes de comprar un pack? Esta muestra gratuita incluye seis fichas de articulación del fonema R con pictogramas. Accede al artículo y solicita el PDF para imprimir por email.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/blog/fichas-logopedia-gratis-imprimir?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-logopedia-gratis-imprimir">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-ejercicios-para-la-r-fuerte-1.png?v=2"><img src="pin-ejercicios-para-la-r-fuerte-1.png?v=2" width="1000" height="1500" loading="lazy" alt="R fuerte: de palabras a frases"></a><figcaption><small>13 · mockup · inicial · 2026-09-23 10:00 Madrid</small><h2>R fuerte: de palabras a frases</h2><p>La guía de ejercicios para la R fuerte organiza la práctica de la RR por niveles, desde el sonido aislado hasta palabras y frases. Incluye una tabla por edad y un apartado sobre cuándo consultar al logopeda.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/ejercicios-para-la-r-fuerte?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-ejercicios-para-la-r-fuerte">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-como-ensenar-la-r-a-un-nino-1.png?v=2"><img src="pin-como-ensenar-la-r-a-un-nino-1.png?v=2" width="1000" height="1500" loading="lazy" alt="R suave y RR: las diferencias"></a><figcaption><small>14 · mockup · inicial · 2026-09-23 19:00 Madrid</small><h2>R suave y RR: las diferencias</h2><p>No suenan igual la R de «pera» y la RR de «perro». El artículo sobre cómo enseñar la R compara ambos sonidos, sus edades orientativas y ejercicios de articulación para entender por dónde empezar.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/como-ensenar-la-r-a-un-nino?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-como-ensenar-la-r-a-un-nino">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-mi-hijo-no-pronuncia-la-s-1.png?v=2"><img src="pin-mi-hijo-no-pronuncia-la-s-1.png?v=2" width="1000" height="1500" loading="lazy" alt="¿Tu peque no pronuncia la S?"></a><figcaption><small>15 · mockup · inicial · 2026-09-23 10:00 Madrid</small><h2>¿Tu peque no pronuncia la S?</h2><p>Si buscas información porque tu hijo no pronuncia la S, aquí tienes una guía sobre sigmatismo: tipos, edades orientativas y qué hacer. La tabla del artículo ayuda a situar el fonema /s/ en su desarrollo.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/mi-hijo-no-pronuncia-la-s?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-mi-hijo-no-pronuncia-la-s">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-praxias-bucofaciales-ninos-1.png?v=2"><img src="pin-praxias-bucofaciales-ninos-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Praxias: qué trabajan y qué no"></a><figcaption><small>16 · mockup · inicial · 2026-09-23 19:00 Madrid</small><h2>Praxias: qué trabajan y qué no</h2><p>Antes de usar praxias bucofaciales, conviene conocer sus límites. Esta guía de logopedia explica para qué sirven y para qué no, además de reunir propuestas con espejo organizadas por zona.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/praxias-bucofaciales-ninos?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-praxias-bucofaciales-ninos">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-ejercicios-de-soplo-para-ninos-1.png?v=2"><img src="pin-ejercicios-de-soplo-para-ninos-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Soplo: plumas, pompas y molinillos"></a><figcaption><small>17 · mockup · inicial · 2026-09-24 10:00 Madrid</small><h2>Soplo: plumas, pompas y molinillos</h2><p>Ideas de juegos de soplo con materiales caseros: carreras de plumas, pompas de jabón y molinillos. El artículo reúne ocho propuestas con edad mínima, materiales y dificultad en una tabla de consulta.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/ejercicios-de-soplo-para-ninos?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-ejercicios-de-soplo-para-ninos">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-dislalia-infantil-tipos-1.png?v=2"><img src="pin-dislalia-infantil-tipos-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Dislalia infantil, explicada con ejemplos"></a><figcaption><small>18 · mockup · inicial · 2026-09-24 19:00 Madrid</small><h2>Dislalia infantil, explicada con ejemplos</h2><p>¿Qué significa dislalia y qué tipos existen? Esta guía de articulación infantil explica las diferencias con ejemplos de pronunciación, información por edad y orientación sobre cuándo consultar.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/dislalia-infantil-tipos?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-dislalia-infantil-tipos">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-ejercicios-para-la-r-fuerte-2.png?v=2"><img src="pin-ejercicios-para-la-r-fuerte-2.png?v=2" width="1000" height="1500" loading="lazy" alt="R fuerte: ¿cuándo conviene consultar?"></a><figcaption><small>19 · mockup · inicial · 2026-09-24 10:00 Madrid</small><h2>R fuerte: ¿cuándo conviene consultar?</h2><p>Cuando la RR sigue costando, la edad y el resto de dificultades importan. La guía de ejercicios para la R fuerte incluye una tabla orientativa y un apartado específico sobre cuándo acudir a logopedia.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/ejercicios-para-la-r-fuerte?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-ejercicios-para-la-r-fuerte">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-como-ensenar-la-r-a-un-nino-2.png?v=2"><img src="pin-como-ensenar-la-r-a-un-nino-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Rotacismo: entender la dificultad con la R"></a><figcaption><small>20 · mockup · inicial · 2026-09-24 19:00 Madrid</small><h2>Rotacismo: entender la dificultad con la R</h2><p>Rotacismo es el término que encontrarás al buscar dificultades con la R. El artículo distingue R suave y RR fuerte, explica las edades esperadas y presenta ejercicios de articulación paso a paso.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/como-ensenar-la-r-a-un-nino?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-como-ensenar-la-r-a-un-nino">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-praxias-bucofaciales-ninos-2.png?v=2"><img src="pin-praxias-bucofaciales-ninos-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Praxias con espejo: conoce sus límites"></a><figcaption><small>21 · mockup · inicial · 2026-09-25 10:00 Madrid</small><h2>Praxias con espejo: conoce sus límites</h2><p>Las praxias bucofaciales no deben confundirse con una solución para cualquier dificultad de pronunciación. Lee sus usos y límites en esta guía, con una tabla de ejercicios y materiales para trabajar con espejo.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/praxias-bucofaciales-ninos?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-praxias-bucofaciales-ninos">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-kit-soplo-2.png?v=2"><img src="pin-kit-soplo-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Soplo: juego compartido y seguimiento"></a><figcaption><small>22 · mockup · inicial · 2026-09-25 19:00 Madrid</small><h2>Soplo: juego compartido y seguimiento</h2><p>Este kit propone juegos de soplo con material casero y una tabla para anotar la práctica. Su enfoque es el control respiratorio y la consciencia oral, no la mejora articulatoria. Puedes ver sus páginas reales.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/recursos/kit-soplo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-kit-soplo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-actividades-ninos-2-anos-lenguaje-1.png?v=2"><img src="pin-actividades-ninos-2-anos-lenguaje-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Lenguaje a los 2 años: juegos cotidianos"></a><figcaption><small>23 · mockup · inicial · 2026-09-25 10:00 Madrid</small><h2>Lenguaje a los 2 años: juegos cotidianos</h2><p>El cesto de los tesoros, los libros con imágenes y el paseo para nombrar objetos son algunas de las actividades de lenguaje para niños de 2 años. La guía reúne doce juegos y explica qué trabaja cada uno.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/blog/actividades-ninos-2-anos-lenguaje?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-actividades-ninos-2-anos-lenguaje">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-etapas-desarrollo-del-lenguaje-1.png?v=2"><img src="pin-etapas-desarrollo-del-lenguaje-1.png?v=2" wi ciolenguaje.com/pinterest/pin-cuaderno-3-6-3.png?v=2"><img src="pin-cuaderno-3-6-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Lenguaje de 3–6 años, paso a paso"></a><figcaption><small>43 · mockup · continuidad · 2026-10-07 10:00 Madrid</small><h2>Lenguaje de 3–6 años, paso a paso</h2><p>Para familias que buscan actividades de lenguaje de 3 a 6 años: este cuaderno reúne veinte propuestas con variaciones de dificultad. Abarca conciencia fonológica, vocabulario, narrativa, articulación y comprensión.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/recursos/cuaderno-3-6?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-cuaderno-3-6">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-ejercicios-para-la-r-fuerte-3.png?v=2"><img src="pin-ejercicios-para-la-r-fuerte-3.png?v=2" width="1000" height="1500" loading="lazy" alt="RR: palabras, frases y trabalenguas"></a><figcaption><small>44 · mockup · continuidad · 2026-10-08 19:00 Madrid</small><h2>RR: palabras, frases y trabalenguas</h2><p>La R fuerte aparece en palabras y conversaciones, no solo como sonido aislado. Esta guía de ejercicios para la RR organiza distintos niveles de práctica e incluye frases y trabalenguas en su recorrido.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/ejercicios-para-la-r-fuerte?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-ejercicios-para-la-r-fuerte">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-guia-dislexia-2.png?v=2"><img src="pin-guia-dislexia-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Dislexia: recursos para casa y escuela"></a><figcaption><small>45 · tarjeta · continuidad · 2026-10-09 10:00 Madrid</small><h2>Dislexia: recursos para casa y escuela</h2><p>Un recurso de dislexia en edad escolar con ejercicios para casa, adaptaciones escolares e información para acompañar a la familia. La página de la guía detalla el contenido y muestra qué recibirás en el PDF.</p><p><small>Dislexia y tartamudez: guía para familias</small></p><a href="https://www.espaciolenguaje.com/recursos/guia-dislexia?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-guia-dislexia">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-fichas-logopedia-gratis-imprimir-8.png?v=2"><img src="pin-fichas-logopedia-gratis-imprimir-8.png?v=2" width="1000" height="1500" loading="lazy" alt="Fichas de logopedia: elige por área"></a><figcaption><small>46 · tarjeta · continuidad · 2026-10-12 19:00 Madrid</small><h2>Fichas de logopedia: elige por área</h2><p>No todas las fichas de logopedia trabajan lo mismo. El artículo distingue articulación, vocabulario, conciencia fonológica, soplo y comprensión, con fuentes de descarga y una muestra gratuita del fonema R.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/blog/fichas-logopedia-gratis-imprimir?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-logopedia-gratis-imprimir">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-vocabulario-ninos-como-ampliar-1.png?v=2"><img src="pin-vocabulario-ninos-como-ampliar-1.png?v=2" width="1000" height="1500" loading="lazy" alt="Vocabulario: libros, conversación y juegos"></a><figcaption><small>47 · tarjeta · continuidad · 2026-10-13 10:00 Madrid</small><h2>Vocabulario: libros, conversación y juegos</h2><p>Lectura compartida, expansión y juegos de categorías aparecen en esta guía de vocabulario infantil. Explica la diferencia entre comprensión y expresión, con ocho técnicas para ampliar las conversaciones cotidianas.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/blog/vocabulario-ninos-como-ampliar?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-vocabulario-ninos-como-ampliar">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-conciencia-fonologica-actividades-2.png?v=2"><img src="pin-conciencia-fonologica-actividades-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Conciencia fonológica para jugar en casa"></a><figcaption><small>48 · tarjeta · continuidad · 2026-10-14 19:00 Madrid</small><h2>Conciencia fonológica para jugar en casa</h2><p>Rimas, sílabas y sonidos tienen su lugar en la conciencia fonológica. Esta guía explica sus niveles y reúne diez actividades para casa, como los cazadores de rimas, con orientación por edades.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/blog/conciencia-fonologica-actividades?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-conciencia-fonologica-actividades">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-mi-hijo-no-pronuncia-la-s-2.png?v=2"><img src="pin-mi-hijo-no-pronuncia-la-s-2.png?v=2" width="1000" height="1500" loading="lazy" alt="La S y el sigmatismo infantil"></a><figcaption><small>49 · tarjeta · continuidad · 2026-10-15 10:00 Madrid</small><h2>La S y el sigmatismo infantil</h2><p>Cuando un niño no pronuncia la S, no todos los errores son iguales. El artículo explica qué es el sigmatismo, sus tipos y causas frecuentes, además de las edades orientativas de adquisición del fonema.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/mi-hijo-no-pronuncia-la-s?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-mi-hijo-no-pronuncia-la-s">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-tartamudez-infantil-cuando-preocuparse-2.png?v=2"><img src="pin-tartamudez-infantil-cuando-preocuparse-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Tartamudez: escuchar y acompañar"></a><figcaption><small>50 · tarjeta · continuidad · 2026-10-16 19:00 Madrid</small><h2>Tartamudez: escuchar y acompañar</h2><p>Si las interrupciones del habla te preocupan, esta guía de tartamudez infantil explica qué observar y qué evitar al acompañar. Encontrarás información sobre disfluencias evolutivas y cuándo pedir ayuda profesional.</p><p><small>Dislexia y tartamudez: guía para familias</small></p><a href="https://www.espaciolenguaje.com/blog/tartamudez-infantil-cuando-preocuparse?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-tartamudez-infantil-cuando-preocuparse">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-pack-completo-3.png?v=2"><img src="pin-pack-completo-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Materiales de logopedia en un solo pack"></a><figcaption><small>51 · tarjeta · continuidad · 2026-10-19 10:00 Madrid</small><h2>Materiales de logopedia en un solo pack</h2><p>El Pack Completo reúne fichas de articulación, dos cuadernos por edad, ejercicios de soplo y calendario semanal. La página detalla los PDF incluidos para que puedas valorar el material antes de comprarlo.</p><p><small>Fichas de logopedia para imprimir</small></p><a href="https://www.espaciolenguaje.com/recursos/pack-completo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-pack-completo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-a-que-edad-debe-hablar-un-nino-2.png?v=2"><img src="pin-a-que-edad-debe-hablar-un-nino-2.png?v=2" width="1000" height="1500" loading="lazy" alt="De las primeras palabras a las frases"></a><figcaption><small>52 · tarjeta · continuidad · 2026-10-20 19:00 Madrid</small><h2>De las primeras palabras a las frases</h2><p>Las primeras palabras y las primeras frases forman parte de un recorrido más amplio. La guía de hitos del lenguaje por edad explica qué ocurre en cada etapa y diferencia hablar de comunicarse.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/blog/a-que-edad-debe-hablar-un-nino?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-a-que-edad-debe-hablar-un-nino">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-actividades-ninos-2-anos-lenguaje-3.png?v=2"><img src="pin-actividades-ninos-2-anos-lenguaje-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Vocabulario a los 2 años: ideas cotidianas"></a><figcaption><small>53 · tarjeta · continuidad · 2026-10-21 10:00 Madrid</small><h2>Vocabulario a los 2 años: ideas cotidianas</h2><p>El cesto de los tesoros y los libros con imágenes son dos de las propuestas de esta guía de lenguaje a los 2 años. Reúne juegos para ampliar vocabulario, fomentar la expresión y trabajar la comprensión.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/blog/actividades-ninos-2-anos-lenguaje?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-actividades-ninos-2-anos-lenguaje">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-praxias-bucofaciales-ninos-3.png?v=2"><img src="pin-praxias-bucofaciales-ninos-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Praxias: usos, materiales y límites"></a><figcaption><small>54 · tarjeta · continuidad · 2026-10-22 19:00 Madrid</small><h2>Praxias: usos, materiales y límites</h2><p>¿Buscas praxias bucofaciales para niños? Antes de escoger ejercicios, lee para qué sirven y para qué no. El artículo organiza las propuestas por zona y detalla los materiales para realizarlas con espejo.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/blog/praxias-bucofaciales-ninos?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-praxias-bucofaciales-ninos">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-guia-tartamudez-3.png?v=2"><img src="pin-guia-tartamudez-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Tartamudez: información también para profesores"></a><figcaption><small>55 · tarjeta · continuidad · 2026-10-23 10:00 Madrid</small><h2>Tartamudez: información también para profesores</h2><p>Acompañar la tartamudez infantil implica a la familia y a la escuela. Esta guía incluye una sección para profesores, pautas familiares y orientación sobre cuándo consultar, además de actividades compartidas.</p><p><small>Dislexia y tartamudez: guía para familias</small></p><a href="https://www.espaciolenguaje.com/recursos/guia-tartamudez?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-guia-tartamudez">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-fichas-logopedia-gratis-imprimir-9.png?v=2"><img src="pin-fichas-logopedia-gratis-imprimir-9.png?v=2" width="1000" height="1500" loading="lazy" alt="Fichas imprimibles para maestros y logopedas"></a><figcaption><small>56 · tarjeta · continuidad · 2026-10-26 19:00 Madrid</small><h2>Fichas imprimibles para maestros y logopedas</h2><p>Vocabulario, articulación y comprensión: esta selección reúne diferentes tipos de fichas de logopedia para imprimir. Revisa las fuentes de material para el aula y accede a la muestra gratuita del fonema R.</p><p><small>Material para logopedas y maestros</small></p><a href="https://www.espaciolenguaje.com/blog/fichas-logopedia-gratis-imprimir?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-fichas-logopedia-gratis-imprimir">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-etapas-desarrollo-del-lenguaje-2.png?v=2"><img src="pin-etapas-desarrollo-del-lenguaje-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Primeros sonidos y primeras palabras"></a><figcaption><small>57 · tarjeta · continuidad · 2026-10-27 10:00 Madrid</small><h2>Primeros sonidos y primeras palabras</h2><p>El desarrollo del lenguaje comienza antes de las primeras palabras. La guía de etapas de 0 a 6 años recorre vocalizaciones, balbuceo y lenguaje posterior, con una tabla de comprensión y expresión por edad.</p><p><small>Actividades de lenguaje 0-3 años</small></p><a href="https://www.espaciolenguaje.com/blog/etapas-desarrollo-del-lenguaje?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-etapas-desarrollo-del-lenguaje">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-juegos-para-estimular-el-habla-2.png?v=2"><img src="pin-juegos-para-estimular-el-habla-2.png?v=2" width="1000" height="1500" loading="lazy" alt="Veo veo, canciones y cuentos"></a><figcaption><small>58 · tarjeta · continuidad · 2026-10-28 19:00 Madrid</small><h2>Veo veo, canciones y cuentos</h2><p>Los juegos para estimular el habla pueden partir de lo que ya hay en casa. Esta selección incluye veo veo, canciones con gestos y cuentacuentos, con explicaciones para compartir la actividad con tu peque.</p><p><small>Actividades de lenguaje 3-6 años</small></p><a href="https://www.espaciolenguaje.com/blog/juegos-para-estimular-el-habla?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-juegos-para-estimular-el-habla">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-kit-soplo-3.png?v=2"><img src="pin-kit-soplo-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Soplo: propuestas y registro de práctica"></a><figcaption><small>59 · tarjeta · continuidad · 2026-10-29 10:00 Madrid</small><h2>Soplo: propuestas y registro de práctica</h2><p>El kit de soplo reúne quince ejercicios progresivos con materiales caseros y una tabla de seguimiento. Está planteado como juego de control respiratorio y consciencia oral, no como mejora de la articulación.</p><p><small>Ejercicios de pronunciación (R, S y más)</small></p><a href="https://www.espaciolenguaje.com/recursos/kit-soplo?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-kit-soplo">Página de destino →</a></figcaption></figure><figure><a href="https://www.espaciolenguaje.com/pinterest/pin-dislexia-en-ninos-como-detectarla-3.png?v=2"><img src="pin-dislexia-en-ninos-como-detectarla-3.png?v=2" width="1000" height="1500" loading="lazy" alt="Dislexia infantil: información por edades"></a><figcaption><small>60 · tarjeta · continuidad · 2026-10-30 19:00 Madrid</small><h2>Dislexia infantil: información por edades</h2><p>Para entender la dislexia en niños hace falta ir más allá de los mitos. El artículo explica sus características y señales según la edad, con orientación para familias que se plantean una valoración profesional.</p><p><small>Dislexia y tartamudez: guía para familias</small></p><a href="https://www.espaciolenguaje.com/blog/dislexia-en-ninos-como-detectarla?utm_source=pinterest&amp;utm_medium=social&amp;utm_campaign=pin-dislexia-en-ninos-como-detectarla">Página de destino →</a></figcaption></figure></main></html>
